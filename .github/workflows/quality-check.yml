name: Skill quality

on:
  pull_request:
    paths:
      - "skills/**"
      - "docs/skill-catalog.md"
      - ".github/scripts/generate_skill_catalog.py"
      - ".github/workflows/quality-check.yml"
      - ".github/workflows/quality_checker.py"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "docs/skill-catalog.md"
      - ".github/scripts/generate_skill_catalog.py"
      - ".github/workflows/quality-check.yml"
      - ".github/workflows/quality_checker.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install PyYAML
      - name: Validate skills
        run: python .github/workflows/quality_checker.py
      - name: Verify generated skill catalog
        run: python .github/scripts/generate_skill_catalog.py --check
